# DigitalOcean App Platform spec for MTG Judge
# Deploy with: doctl apps create --spec app-spec.yml
# Or via DO MCP: mcp__digitalocean__apps_create_app_from_spec

name: mtg-judge
region: nyc1
services:
  - name: api
    dockerfile_path: demo/Dockerfile
    http_port: 8000
    instance_size_slug: professional-xs  # 1 vCPU, 2GB RAM (minimum)
    # For better performance: professional-l (4 vCPU, 8GB RAM, $48/mo)
    health_check:
      http_path: /api/health
      initial_delay_seconds: 60  # Ollama + model loading
    routes:
      - path: /
